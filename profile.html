<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#0a0e27;
    --violet:#6d5bf5;
    --cyan:#22d3ee;
    --pink:#f472b6;
    --paper:#f6f7fb;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper); color:var(--ink); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-family:'Space Grotesk',system-ui,sans-serif;}
  .icon{width:18px; height:18px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  .back-btn{
    position:fixed; top:22px; left:22px; z-index:100;
    background:rgba(255,255,255,.95); color:var(--ink); padding:11px 20px 11px 16px;
    border-radius:999px; text-decoration:none; font-weight:600; font-size:.92rem;
    box-shadow:0 6px 20px rgba(10,14,39,.18); transition:.25s;
    display:flex; align-items:center; gap:8px;
  }
  .back-btn:hover{transform:translateX(-4px);}

  .music-ctrl{
    position:fixed; top:22px; right:22px; z-index:100;
    background:rgba(255,255,255,.16); color:#fff;
    padding:11px 16px; border-radius:999px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
    border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(6px);
    transition:.25s; font-size:.85rem; font-weight:600;
  }
  .music-ctrl:hover{background:rgba(255,255,255,.28);}
  .bars{display:flex; align-items:flex-end; gap:2px; height:14px;}
  .bars span{width:3px; background:#fff; border-radius:2px; height:4px; transition:height .2s;}
  .music-ctrl.playing .bars span{animation:bounce 1s ease-in-out infinite;}
  .music-ctrl.playing .bars span:nth-child(1){animation-delay:0s;}
  .music-ctrl.playing .bars span:nth-child(2){animation-delay:.15s;}
  .music-ctrl.playing .bars span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,100%{height:4px;} 50%{height:14px;}}

  .hero{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg,#221a5e 0%, var(--violet) 45%, var(--cyan) 100%);
    color:#fff; padding:40px; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 85% 15%, rgba(255,255,255,.16), transparent 55%);
  }

  .hero-content{
    max-width:1100px; width:100%; position:relative; z-index:2;
    display:grid; grid-template-columns:1.2fr 1fr; gap:60px; align-items:center;
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.85rem; font-weight:600; color:rgba(255,255,255,.85);
    background:rgba(255,255,255,.14); padding:6px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.25); margin-bottom:20px;
  }
  .hero-text h1{font-size:clamp(2.4rem,5vw,4rem); font-weight:700; line-height:1.02; letter-spacing:-.01em;}
  .subtitle{font-size:1.15rem; opacity:.85; margin-top:10px; font-weight:500;}

  .info-box{
    background:rgba(255,255,255,.12); padding:24px; border-radius:22px;
    border:1px solid rgba(255,255,255,.22); margin-top:32px; backdrop-filter:blur(6px);
  }
  .info-item{margin:10px 0; font-size:1.02rem; display:flex; align-items:center; gap:12px; font-weight:500;}

  .insta-btn{
    display:inline-flex; align-items:center; gap:9px;
    background:linear-gradient(135deg,#f472b6,#f59e0b);
    color:#fff; padding:11px 20px; border-radius:14px; text-decoration:none;
    margin-top:18px; font-weight:600; font-size:.95rem; transition:.25s;
  }
  .insta-btn:hover{transform:translateY(-3px); box-shadow:0 10px 22px rgba(244,114,182,.4);}

  .profile-image{
    width:100%; aspect-ratio:1; border-radius:32px; overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.35); border:5px solid rgba(255,255,255,.25);
    animation:float 6s ease-in-out infinite;
  }
  .profile-image img{width:100%; height:100%; object-fit:cover; display:block;}
  @media (prefers-reduced-motion:reduce){.profile-image{animation:none;}}
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-18px);}}

  @media (max-width:900px){
    .hero-content{grid-template-columns:1fr; text-align:center; margin-top:80px;}
    .profile-image{max-width:340px; margin:0 auto;}
    .info-box{display:inline-block; text-align:left;}
    .info-item{justify-content:flex-start;}
  }

  .yt-profile-player{position:fixed;left:-1000px;top:-1000px;width:200px;height:200px;overflow:hidden;opacity:0;pointer-events:none;z-index:-1}
  .yt-profile-player iframe{display:block;width:200px;height:200px;border:0}
</style>
</head>
<body>

<a href="index.html" class="back-btn">
  <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back
</a>

<div class="music-ctrl" id="musicBtn" onclick="handleMusic()">
  <svg class="icon" id="playIcon" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>
  <svg class="icon" id="muteIcon" viewBox="0 0 24 24" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  <span class="bars" id="bars" style="display:none"><span></span><span></span><span></span></span>
  <span id="musicLabel">Play track</span>
</div>
<audio id="bgMusic" loop></audio>
<div class="yt-profile-player" id="ytProfilePlayer" aria-hidden="true"><iframe id="ytProfileFrame" title="YouTube audio player" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1"></iframe></div>

<section class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <span class="eyebrow">
        <svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" stroke="none"/></svg>
        The Legends member
      </span>
      <h1 id="userName">Student Name</h1>
      <p class="subtitle">PBIC · Session 2026–27</p>

      <div class="info-box">
        <div class="info-item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
          Academic Excellence
        </div>
        <div class="info-item">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          The Legends Member
        </div>

        <a href="#" id="instaLink" target="_blank" rel="noopener" class="insta-btn">
          <svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
          <span id="instaText">Instagram</span>
        </a>
      </div>
    </div>

    <div class="profile-image">
      <img id="userImg" src="" alt="Profile" fetchpriority="high" decoding="async">
    </div>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name");
  const img = params.get("img");
  const insta = params.get("insta");
  const music = params.get("music");

  if (name) {
    document.getElementById("userName").textContent = name;
    document.title = name + " | PBIC — The Legends";
  }
  if (img) document.getElementById("userImg").src = img;

  const instaLink = document.getElementById("instaLink");
  if (insta) {
    instaLink.href = "https://www.instagram.com/" + insta;
    document.getElementById("instaText").textContent = "@" + insta;
  } else {
    instaLink.style.display = "none";
  }

  const audio = document.getElementById("bgMusic");
  const musicBtn = document.getElementById("musicBtn");
  const playIcon = document.getElementById("playIcon");
  const muteIcon = document.getElementById("muteIcon");
  const bars = document.getElementById("bars");
  const musicLabel = document.getElementById("musicLabel");
  let isPlaying = false;

  const ytPlayerBox = document.getElementById("ytProfilePlayer");
  const ytFrame = document.getElementById("ytProfileFrame");
  const isYouTube = /^youtube:[A-Za-z0-9_-]+$/.test(music || "");
  const youtubeId = isYouTube ? music.slice(8) : "";

  let ytPlayer = null;
  let ytReady = false;
  let ytPlaying = false;
  let ytApiLoading = false;

  if (isYouTube) {
    musicBtn.style.display = "flex";
    musicLabel.textContent = "Play track";
  } else if (music) {
    audio.preload = "none";
    audio.src = music;
  } else {
    musicBtn.style.display = "none";
  }

  function setState(playing, muted) {
    if (playing && !muted) {
      playIcon.style.display = "none";
      muteIcon.style.display = "none";
      bars.style.display = "flex";
      musicLabel.textContent = "Playing";
      musicBtn.classList.add("playing");
    } else if (playing && muted) {
      playIcon.style.display = "none";
      muteIcon.style.display = "inline-block";
      bars.style.display = "none";
      musicLabel.textContent = "Muted";
      musicBtn.classList.remove("playing");
    } else {
      playIcon.style.display = "inline-block";
      muteIcon.style.display = "none";
      bars.style.display = "none";
      musicLabel.textContent = "Play track";
      musicBtn.classList.remove("playing");
    }
  }

  let ytPlaying=false;
  let ytStarted=false;

  // Use a direct iframe URL from the user's Play-track click.
  // This keeps the click as the browser's user gesture, which is important
  // for audio playback. The video itself stays off-screen.
  function startYouTubeFromClick(){
    if(!isYouTube)return;

    const src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(youtubeId) +
      "?autoplay=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1";

    ytFrame.src=src;
    ytStarted=true;
    ytPlaying=true;
    setState(true,false);
    musicLabel.textContent="Playing";
  }

  function pauseYouTube(){
    if(!ytFrame.contentWindow)return;
    ytFrame.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:"pauseVideo",
        args:[]
      }),
      "https://www.youtube-nocookie.com"
    );
    ytPlaying=false;
    setState(false,false);
  }

  function playYouTube(){
    if(!ytStarted){
      startYouTubeFromClick();
      return;
    }

    if(!ytFrame.contentWindow){
      startYouTubeFromClick();
      return;
    }

    ytFrame.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:"playVideo",
        args:[]
      }),
      "https://www.youtube-nocookie.com"
    );
    ytPlaying=true;
    setState(true,false);
  }

  function handleMusic() {
    if (isYouTube) {
      if (!ytPlaying) {
        playYouTube();
      } else {
        pauseYouTube();
      }
      return;
    }
    if (!isPlaying) {
      audio.play();
      isPlaying = true;
      setState(true, false);
    } else {
      audio.pause();
      isPlaying = false;
      setState(false, false);
    }
  }
</script>
</body>
</html>

      musicLabel.textContent = "Play track";
      musicBtn.classList.remove("playing");
    }
  }

  let ytPlaying=false;
  let ytStarted=false;

  // Use a direct iframe URL from the user's Play-track click.
  // This keeps the click as the browser's user gesture, which is important
  // for audio playback. The video itself stays off-screen.
  function startYouTubeFromClick(){
    if(!isYouTube)return;

    const src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(youtubeId) +
      "?autoplay=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1";

    ytFrame.src=src;
    ytStarted=true;
    ytPlaying=true;
    setState(true,false);
    musicLabel.textContent="Playing";
  }

  function pauseYouTube(){
    if(!ytFrame.contentWindow)return;
    ytFrame.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:"pauseVideo",
        args:[]
      }),
      "https://www.youtube-nocookie.com"
    );
    ytPlaying=false;
    setState(false,false);
  }

  function playYouTube(){
    if(!ytStarted){
      startYouTubeFromClick();
      return;
    }

    if(!ytFrame.contentWindow){
      startYouTubeFromClick();
      return;
    }

    ytFrame.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:"playVideo",
        args:[]
      }),
      "https://www.youtube-nocookie.com"
    );
    ytPlaying=true;
    setState(true,false);
  }

  function handleMusic() {
    if (isYouTube) {
      if (!ytPlaying) {
        playYouTube();
      } else {
        pauseYouTube();
      }
      return;
    }
    if (!isPlaying) {
      audio.play();
      isPlaying = true;
      setState(true, false);
    } else {
      audio.pause();
      isPlaying = false;
      setState(false, false);
    }
  }
</script>
</body>
</html>
