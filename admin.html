<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBIC Admin | Approvals</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#0a0e27;padding:25px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(10,14,39,.08)}img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.meta{padding:12px 0}.name{font-size:1.3rem;font-weight:800}.muted{color:#64748b;font-size:.9rem;margin-top:4px}.intro{margin-top:10px;color:#334155;line-height:1.5}.actions{display:flex;gap:9px;margin-top:14px}button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.approve{background:#16a34a;color:#fff}.reject{background:#fee2e2;color:#991b1b}.login{max-width:420px;margin:80px auto;background:#fff;padding:25px;border-radius:20px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px}h1{margin:0}.status{margin:10px 0;padding:10px;background:#eef2ff;border-radius:10px}@media(max-width:600px){body{padding:15px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>🛡️ Admin Approvals</h1><div class="muted">Review new Legends before publishing.</div></div><a href="index.html">← Website</a></div><div id="app"></div></div><script>
const app=document.getElementById('app');const cfg=window.PBIC_SUPABASE;let sb;
function login(){app.innerHTML=`<div class="login"><h2>Admin Login</h2><p class="muted">Use the Supabase Auth account you created for the admin.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><div id="msg" class="status"></div></div>`}async function doLogin(){const m=document.getElementById('msg');const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});m.textContent=error?error.message:'Logged in…';if(!error)load()}
async function load(){const {data,error}=await sb.from('submissions').select('*').eq('status','pending').order('created_at',{ascending:false});if(error){app.innerHTML='<div class="status">'+error.message+'</div>';return}app.innerHTML='<div class="grid">'+(data.length?data.map(x=>`<article class="card"><img src="${x.photo_url}" alt="${x.name}"><div class="meta"><div class="name">${x.name}</div><div class="muted">${x.class_name||''} ${x.instagram?' · @'+x.instagram:''}</div><div class="intro">${x.ai_intro||x.details||'No details'}</div><div class="actions"><button class="approve" onclick="approve('${x.id}')">✓ Approve & Publish</button><button class="reject" onclick="rejectIt('${x.id}')">Reject</button></div></div></article>`).join(''):'<div class="status">🎉 No pending submissions.</div>')+'</div>'}
async function approve(id){const {data:s,error}=await sb.from('submissions').select('*').eq('id',id).single();if(error)return alert(error.message);let r=await sb.from('profiles').insert({submission_id:s.id,name:s.name,instagram:s.instagram,class_name:s.class_name,details:s.details,photo_url:s.photo_url,song_url:s.song_url,ai_intro:s.ai_intro});if(r.error)return alert(r.error.message);r=await sb.from('submissions').update({status:'approved'}).eq('id',id);if(r.error)alert(r.error.message);load()}
async function rejectIt(id){await sb.from('submissions').update({status:'rejected'}).eq('id',id);load()}
(async()=>{if(!cfg||cfg.url.startsWith('YOUR_')){app.innerHTML='<div class="status">Configure Supabase first: edit <b>supabase-config.js</b> and run <b>supabase.sql</b>.</div>';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data}=await sb.auth.getSession();data.session?load():login()})();
</script></body></html>
