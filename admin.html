<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBIC Admin | Approvals & Profiles</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260904"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#0a0e27;padding:25px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}a{color:inherit}.section{margin:28px 0}.section h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(10,14,39,.08)}img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.meta{padding:12px 0}.name{font-size:1.3rem;font-weight:800}.muted{color:#64748b;font-size:.9rem;margin-top:4px}.intro{margin-top:10px;color:#334155;line-height:1.5}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.approve{background:#16a34a;color:#fff}.reject,.delete{background:#fee2e2;color:#991b1b}.keep{background:#e0f2fe;color:#075985}.login{max-width:420px;margin:80px auto;background:#fff;padding:25px;border-radius:20px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px}h1{margin:0}.status{margin:10px 0;padding:10px;background:#eef2ff;border-radius:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.smallbtn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer;background:#e2e8f0}.empty{grid-column:1/-1}.danger-note{font-size:.85rem;color:#991b1b;margin-top:8px}@media(max-width:600px){body{padding:15px}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🛡️ Admin Panel</h1><div class="muted">Approve new Legends and manage published profiles.</div></div>
    <a href="index.html">← Website</a>
  </div>
  <div id="app"></div>
</div>
<script>
const app=document.getElementById('app');
const cfg=window.PBIC_SUPABASE||{};
let sb;

const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function login(){
  app.innerHTML=`<div class="login"><h2>Admin Login</h2><p class="muted">Use the Supabase Auth account you created for the admin.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="smallbtn" style="width:100%" onclick="doLogin()">Login</button><div id="msg" class="status"></div></div>`;
}

async function doLogin(){
  const m=document.getElementById('msg');
  m.textContent='Logging in…';
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});
  if(error){m.textContent='❌ '+error.message;return;}
  await load();
}

async function load(){
  app.innerHTML='<div class="status">Loading…</div>';
  const [pendingRes,profilesRes]=await Promise.all([
    sb.from('submissions').select('*').eq('status','pending').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('name',{ascending:true})
  ]);
  if(pendingRes.error){app.innerHTML='<div class="status">❌ '+esc(pendingRes.error.message)+'</div>';return;}
  if(profilesRes.error){app.innerHTML='<div class="status">❌ '+esc(profilesRes.error.message)+'</div>';return;}
  const pending=pendingRes.data||[];
  const profiles=profilesRes.data||[];
  app.innerHTML=`
    <div class="section">
      <div class="toolbar"><div><h2>📥 Pending Submissions</h2><div class="muted">New profiles waiting for approval.</div></div><button class="smallbtn" onclick="load()">↻ Refresh</button></div>
      <div class="grid">${pending.length?pending.map(x=>pendingCard(x)).join(''):'<div class="status empty">🎉 No pending submissions.</div>'}</div>
    </div>
    <div class="section">
      <div class="toolbar"><div><h2>👥 Published Profiles</h2><div class="muted">Names are shown alphabetically. Keep or delete any profile.</div></div></div>
      <div class="grid">${profiles.length?profiles.map(x=>profileCard(x)).join(''):'<div class="status empty">No published profiles yet.</div>'}</div>
    </div>`;
}

function pendingCard(x){
  return `<article class="card"><img src="${esc(x.photo_url)}" alt="${esc(x.name)}"><div class="meta"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.class_name||'')}${x.instagram?' · @'+esc(x.instagram):''}</div><div class="intro">${esc(x.ai_intro||x.details||'No details')}</div><div class="actions"><button class="approve" onclick="approve('${x.id}')">✓ Approve & Publish</button><button class="reject" onclick="rejectIt('${x.id}')">Reject</button></div></div></article>`;
}

function profileCard(x){
  return `<article class="card"><img src="${esc(x.photo_url)}" alt="${esc(x.name)}"><div class="meta"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.class_name||'')}${x.instagram?' · @'+esc(x.instagram):''}</div><div class="intro">${esc(x.ai_intro||x.details||'No details')}</div><div class="actions"><button class="keep" onclick="keepProfile()">✓ Keep</button><button class="delete" onclick="deleteProfile('${x.id}','${esc(x.name).replace(/'/g,"\'")}')">🗑 Delete</button></div></div></article>`;
}

async function approve(id){
  const {data:s,error}=await sb.from('submissions').select('*').eq('id',id).single();
  if(error){alert(error.message);return;}
  const r=await sb.from('profiles').insert({submission_id:s.id,name:s.name,instagram:s.instagram,class_name:s.class_name,details:s.details,photo_url:s.photo_url,song_url:s.song_url,ai_intro:s.ai_intro});
  if(r.error){alert(r.error.message);return;}
  const u=await sb.from('submissions').update({status:'approved'}).eq('id',id);
  if(u.error){alert(u.error.message);return;}
  await load();
}

async function rejectIt(id){
  const r=await sb.from('submissions').update({status:'rejected'}).eq('id',id);
  if(r.error){alert(r.error.message);return;}
  await load();
}

function keepProfile(){
  alert('This profile is already published and will stay on the website.');
}

async function deleteProfile(id){
  if(!confirm('Delete this profile from the published website? This cannot be undone.'))return;
  const {error}=await sb.from('profiles').delete().eq('id',id);
  if(error){alert('Delete failed: '+error.message);return;}
  await load();
}

(async()=>{
  try{
    if(!cfg.url||cfg.url.startsWith('YOUR_')||!cfg.anonKey||cfg.anonKey.startsWith('YOUR_')){
      app.innerHTML='<div class="status">Configure Supabase first: edit <b>supabase-config.js</b>.</div>';return;
    }
    const publishableKey=cfg.anonKey;
    const safeFetch=async(input,init={})=>{
      const headers=new Headers(init.headers||{});
      if(headers.get('Authorization')===`Bearer ${publishableKey}`)headers.delete('Authorization');
      return fetch(input,{...init,headers});
    };
    sb=window.supabase.createClient(cfg.url,publishableKey,{global:{fetch:safeFetch}});
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    data.session?load():login();
  }catch(e){app.innerHTML='<div class="status">❌ '+esc(e.message||e)+'</div>';}
})();
</script>
</body>
</html>
